<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIYESH VIP SENSI TOOL 200</title>
    <style>
        /* RGB GLOW ANIMATION FOR PRIYESH NAME */
        @keyframes rgbGlow {
            0% { color: #ff0055; text-shadow: 0 0 15px #ff0055; }
            33% { color: #00ff66; text-shadow: 0 0 15px #00ff66; }
            66% { color: #00eaff; text-shadow: 0 0 15px #00eaff; }
            100% { color: #ff0055; text-shadow: 0 0 15px #ff0055; }
        }

        @keyframes bgGradient {
            0% { background-position: 0% auto; }
            100% { background-position: 200% auto; }
        }

        @keyframes boxPop {
            from { opacity: 0; transform: scale(0.95) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        body {
            background: radial-gradient(circle at center, #1c0505 0%, #050508 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        /* BANNER IMAGE STYLING */
        .banner-container {
            max-width: 600px;
            margin: 15px auto 0 auto;
            border-radius: 15px 15px 0 0;
            overflow: hidden;
            border: 2px solid #ff1a1a;
            border-bottom: none;
            box-shadow: 0 -5px 25px rgba(255, 26, 26, 0.4);
        }

        .banner-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: 600px;
            margin: 0 auto 40px auto;
            background: rgba(15, 17, 26, 0.95);
            padding: 30px;
            border-radius: 0 0 15px 15px;
            border: 2px solid #ff1a1a;
            box-shadow: 0 15px 35px rgba(255, 26, 26, 0.3);
            box-sizing: border-box;
        }

        .dev-name {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
            animation: rgbGlow 3s linear infinite;
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 14px;
            background-color: #090a0f;
            border: 2px solid #2d3748;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        select:focus {
            border-color: #ff1a1a;
        }

        /* VIP BUTTON */
        .btn {
            background: linear-gradient(90deg, #ff1a1a, #ff7300, #ff1a1a);
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: bgGradient 2s linear infinite;
            box-shadow: 0 4px 15px rgba(255, 26, 26, 0.4);
        }

        .btn:hover {
            transform: scale(1.01);
        }

        /* RESULT BOX */
        .result-box {
            display: none; /* शुरू में छुपा रहेगा */
            margin-top: 30px;
            padding: 25px;
            background: #07080c;
            border-radius: 12px;
            border: 1px solid #ff1a1a;
            border-left: 5px solid #ff1a1a;
            text-align: left;
            animation: boxPop 0.4s ease-out forwards;
        }

        .result-title {
            color: #ff7300;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 10px;
        }

        .sensi-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #171923;
            font-size: 18px;
        }

        .sensi-value {
            color: #00ff66;
            font-weight: bold;
            background: rgba(0, 255, 102, 0.1);
            padding: 4px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }

        .tip {
            margin-top: 20px;
            font-size: 14px;
            color: #ffcc00;
            background-color: rgba(255, 204, 0, 0.08);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

    <!-- TOP ANIME EYE BANNER (आपकी भेजी हुई फोटो का बैकअप लिंक) -->
    <div class="banner-container">
        <img class="banner-img" src="https://ibb.co" alt="Gaming Banner">
    </div>

    <div class="container">
        <!-- PRIYESH NAME -->
        <div class="dev-name">BY PRIYESH</div>
        <h1>VIP Sensi Modifier (Update 200%)</h1>

        <div class="form-group">
            <label>Device Ki RAM Select Karein:</label>
            <select id="ram">
                <option value="2">2 GB - 3 GB RAM</option>
                <option value="4" selected>4 GB RAM (Laggy Fix)</option>
                <option value="6">6 GB RAM (Balanced)</option>
                <option value="8">8 GB RAM (High FPS)</option>
                <option value="12">12 GB RAM / iOS Ultimate</option>
            </select>
        </div>

        <div class="form-group">
            <label>Game Ka Version:</label>
            <select id="version">
                <option value="normal">Free Fire (Normal)</option>
                <option value="max">Free Fire MAX</option>
            </select>
        </div>

        <!-- यहाँ फंक्शन का नाम बिल्कुल सही कर दिया है -->
        <button class="btn" onclick="generateSensi200()">Apply VIP Injector 🔥</button>

        <!-- Result Box -->
        <div class="result-box" id="resultBox">
            <div class="result-title" id="outputDevice">CONFIGURED SETTINGS:</div>
            
            <div class="sensi-item"><span class="sensi-name">General</span> <span class="sensi-value" id="vGeneral">0</span></div>
            <div class="sensi-item"><span class="sensi-name">Red Dot</span> <span class="sensi-value" id="vRedDot">0</span></div>
            <div class="sensi-item"><span class="sensi-name">2X Scope</span> <span class="sensi-value" id="v2x">0</span></div>
            <div class="sensi-item"><span class="sensi-name">4X Scope</span> <span class="sensi-value" id="v4x">0</span></div>
            <div class="sensi-item"><span class="sensi-name">Sniper Scope</span> <span class="sensi-value" id="vSniper">0</span></div>
            <div class="sensi-item"><span class="sensi-name">Free Look</span> <span class="sensi-value" id="vFreeLook">0</span></div>

            <div class="tip" id="fireButtonTip">💡 VIP Tip: Fire Button Size सेट करें।</div>
        </div>
    </div>

    <script>
        // मेन सेंसिटिविटी जनरेटर फंक्शन
        function generateSensi200() {
            var ram = document.getElementById("ram").value;
            var version = document.getElementById("version").value;
            
            var general, redDot, scope2x, scope4x, sniper, freeLook, fireBtn;

            // 200% सेंसिटिविटी का नया लॉजिक
            if (ram === "2") {
                general = 200; redDot = 196; scope2x = 188; scope4x = 194; sniper = 110; freeLook = 150; fireBtn = "40%";
            } else if (ram === "4") {
                general = 194; redDot = 185; scope2x = 176; scope4x = 182; sniper = 95; freeLook = 140; fireBtn = "44%";
            } else if (ram === "6") {
                general = 182; redDot = 172; scope2x = 164; scope4x = 170; sniper = 85; freeLook = 125; fireBtn = "48%";
            } else if (ram === "8") {
                general = 174; redDot = 160; scope2x = 152; scope4x = 158; sniper = 75; freeLook = 110; fireBtn = "52%";
            } else {
                general = 162; redDot = 148; scope2x = 142; scope4x = 145; sniper = 65; freeLook = 95; fireBtn = "55%";
            }

            // Free Fire MAX के लिए एडजस्टमेंट
            if (version === "max") {
                general = Math.min(200, parseInt(general) + 5);
                redDot = Math.max(100, parseInt(redDot) - 4);
            }

            // स्क्रीन पर डेटा अपडेट करना
            document.getElementById("vGeneral").innerText = general + " / 200";
            document.getElementById("vRedDot").innerText = redDot + " / 200";
            document.getElementById("v2x").innerText = scope2x + " / 200";
            document.getElementById("v4x").innerText = scope4x + " / 200";
            document.getElementById("vSniper").innerText = sniper + " / 200";
            document.getElementById("vFreeLook").innerText = freeLook + " / 200";
            
            document.getElementById("outputDevice").innerText = "⚡ PRIYESH CONFIG APPROVED (" + ram + "GB RAM)";
            document.getElementById("fireButtonTip").innerText = "🎯 VIP Tip: Only Red Numbers के लिए अपना Fire Button Size " + fireBtn + " पर लॉक करें!";
            
            // रिजल्ट बॉक्स को दिखाना
            document.getElementById("resultBox").style.display = "block";
        }
    </script>
</body>
</html>
